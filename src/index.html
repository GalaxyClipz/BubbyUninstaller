<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; media-src file:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>BubbyUninstaller</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><img src="logo.svg" alt="" class="logo">Bubby<b>Uninstaller</b></div>
    <div class="status">
      <label class="drive" title="Which drive to scan">Drive <select id="drive"></select></label>
      <button class="pill" id="music" title="Background music on/off">♪ Music</button>
      <span id="admin"></span>
    </div>
  </header>
  <main id="view"></main>
  <footer id="hints" class="hints"></footer>
  <script src="music.js"></script>
  <script src="app.js"></script>
</body>
</html>
